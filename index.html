<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTTP Methods Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f4f7fb;
        color: #1f2937;
      }

      .container {
        max-width: 700px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      .example {
        margin-bottom: 32px;
        padding: 20px;
        border: 1px solid #dfe7f1;
        border-radius: 10px;
        background: #fafcff;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      input, button {
        padding: 10px 12px;
        margin-top: 8px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        font-size: 1rem;
      }

      button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
      }

      a {
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>HTTP Method Examples</h1>

      <div class="example">
        <h2>GET Method Example</h2>
        <p>
          GET is used to request data. The parameters appear in the URL.
        </p>

        <form action="https://www.example.com/search" method="get">
          <label for="query">Search term</label>
          <input id="query" name="q" type="text" placeholder="Enter search text" />
          <button type="submit">Search with GET</button>
        </form>

        <p>
          Sample link:
          <a href="https://www.example.com/search?q=html+forms">Open GET example link</a>
        </p>
      </div>

      <div class="example">
        <h2>POST Method Example</h2>
        <p>
          POST sends data in the request body and is commonly used for forms.
        </p>

        <form action="https://www.example.com/submit" method="post">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name" />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" />

          <button type="submit">Submit with POST</button>
        </form>
      </div>
    </div>
  </body>
</html>
